[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hook-line-sync"
dynamic = ["version"]
description = "Synchronize local files with remote servers over explicit FTPS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hook Line Sync contributors" }]
keywords = ["deployment", "ftp", "ftps", "synchronization"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
]
[project.urls]
Homepage = "https://github.com/ediril/hook-line-sync"
Changelog = "https://github.com/ediril/hook-line-sync/blob/main/CHANGELOG.md"
Issues = "https://github.com/ediril/hook-line-sync/issues"
Repository = "https://github.com/ediril/hook-line-sync.git"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pyftpdlib[ssl]>=2.0,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "setuptools>=77",
  "twine>=6,<7",
]

[project.scripts]
hlsync = "hlsync.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hlsync.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
